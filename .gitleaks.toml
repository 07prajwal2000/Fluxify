# Secret scanning for CI (see the `secret-scan` job). Gitleaks' default rules
# plus an allowlist for files that hold placeholder credentials on purpose.
[extend]
useDefault = true

[[allowlists]]
description = "placeholder credentials in env examples, docs, tests and vendored typings"
paths = [
	'''(^|/)\.?env\.example$''',
	'''^docs/''',
	'''\.(spec|test)\.ts$''',
	'''(^|/)(tests?|testing)/''',
]
