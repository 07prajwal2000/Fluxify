# ==============================================================================
# Fluxify PRODUCTION — scale-out stack.
#   admin   : control plane (server API + web UI + AI gateway). Runs DB
#             migrations, and hosts the compiler that fills the NATS KV bucket.
#   worker-project-a / -b : compiled request executors, one service per project,
#             2 replicas each = 4 containers. No database connection.
#   traefik : edge reverse proxy. Chosen over Caddy because it discovers the
#             worker replicas automatically from Docker labels and load-balances
#             across them with zero static config.
#
#   docker compose -f docker/production/docker-compose.yml up -d
#
# Routing (Traefik):
#   /_/admin*                 -> admin (its internal proxy splits ui / api / ai)
#   Host(project-a.localhost) -> worker-project-a replicas
#   Host(project-b.localhost) -> worker-project-b replicas
#
# Required in docker/production/.env, on top of the usual settings:
#   PROJECT_A_ID, PROJECT_B_ID  — project uuids, one per worker service
#   MASTER_ENCRYPTION_KEY       — shared by admin and workers; config artifacts
#                                 are encrypted with it in KV
# ==============================================================================
services:
  traefik:
    image: traefik:v3.7.8
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # Explicit socket endpoint (the v3 default; stated for clarity).
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      # Dashboard + access logs for debugging routing (see :8081).
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "8080:80"
      - "8081:8080" # Traefik dashboard — http://localhost:8081/dashboard/
    volumes:
      # Read-only socket access so Traefik can watch service labels.
      # On Docker Desktop (Windows/Mac) this path is proxied and works as-is.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fluxify_net

  admin:
    # image: ghcr.io/fluxify-rest/fluxify-admin:latest
    build:
      context: ../..
      dockerfile: docker/admin/Dockerfile
    container_name: fluxify-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Control plane only — the worker service serves user API traffic.
      ENABLE_ADMIN: "true"
      ENABLE_BUILTIN_WORKER: "false"
    # Test suites run user-authored code in child processes of THIS container,
    # so it needs a ceiling. Per-child rlimits are set at spawn time; these are
    # the backstop for a fleet of them. A Dockerfile cannot set either — ulimits
    # and memory are runtime settings.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      nats:
        condition: service_started
    labels:
      - traefik.enable=true
      - "traefik.http.routers.admin.rule=PathPrefix(`/_/admin`)"
      - traefik.http.routers.admin.priority=100
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.services.admin.loadbalancer.server.port=8080
    networks:
      - fluxify_net

  # ---------------------------------------------------------------------------
  # Compiled workers — one SERVICE per project, two replicas each (4 containers).
  #
  # A compiled worker serves exactly one project: WORKER_PROJECT_ID decides which
  # artifacts it pulls from NATS KV. That is why projects cannot share a service
  # — replicas of a service share their environment, so they share a project.
  # Adding a project means adding a service, not raising `replicas`.
  #
  # Routed by Host, not by path: user API routes own the whole path space, so
  # there is no prefix left to tell projects apart. Point both hostnames at this
  # host (/etc/hosts or real DNS) to try it locally.
  #
  # These containers never connect to Postgres — no PG_URL, and no dependency on
  # it. They need NATS (JetStream + KV) and Redis only.
  # ---------------------------------------------------------------------------
  worker-project-a:
    # image: ghcr.io/fluxify-rest/fluxify-worker-compiled:latest
    build:
      context: ../..
      dockerfile: docker/worker-compiled/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Replace with the real project uuid from the admin UI.
      WORKER_PROJECT_ID: "${PROJECT_A_ID:?set PROJECT_A_ID in docker/production/.env}"
      INTEGRATION_TIMEOUT_POLICY_IN_SEC: "${INTEGRATION_TIMEOUT_POLICY_IN_SEC:-450}"
    # No container_name: replicas each need a unique name.
    deploy:
      replicas: 2
    depends_on:
      # admin runs the compiler, which fills KV. Workers idle harmlessly until
      # artifacts appear, and the readiness probe keeps traffic off them.
      admin:
        condition: service_started
      valkey:
        condition: service_started
      nats:
        condition: service_started
    labels:
      - traefik.enable=true
      - "traefik.http.routers.worker-a.rule=Host(`project-a.localhost`)"
      - traefik.http.routers.worker-a.priority=1
      - traefik.http.routers.worker-a.entrypoints=web
      - traefik.http.services.worker-a.loadbalancer.server.port=5600
      # Health is on 5601, served by the supervisor. Checking 5600 would hit a
      # isolated execution process and does not describe supervisor health.
      - traefik.http.services.worker-a.loadbalancer.healthcheck.path=/_/admin/api/healthchecks/ready
      - traefik.http.services.worker-a.loadbalancer.healthcheck.port=5601
      - traefik.http.services.worker-a.loadbalancer.healthcheck.interval=10s
    networks:
      - fluxify_net

  worker-project-b:
    # image: ghcr.io/fluxify-rest/fluxify-worker-compiled:latest
    build:
      context: ../..
      dockerfile: docker/worker-compiled/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_PROJECT_ID: "${PROJECT_B_ID:?set PROJECT_B_ID in docker/production/.env}"
      INTEGRATION_TIMEOUT_POLICY_IN_SEC: "${INTEGRATION_TIMEOUT_POLICY_IN_SEC:-450}"
    deploy:
      replicas: 2
    depends_on:
      admin:
        condition: service_started
      valkey:
        condition: service_started
      nats:
        condition: service_started
    labels:
      - traefik.enable=true
      - "traefik.http.routers.worker-b.rule=Host(`project-b.localhost`)"
      - traefik.http.routers.worker-b.priority=1
      - traefik.http.routers.worker-b.entrypoints=web
      - traefik.http.services.worker-b.loadbalancer.server.port=5600
      - traefik.http.services.worker-b.loadbalancer.healthcheck.path=/_/admin/api/healthchecks/ready
      - traefik.http.services.worker-b.loadbalancer.healthcheck.port=5601
      - traefik.http.services.worker-b.loadbalancer.healthcheck.interval=10s
    networks:
      - fluxify_net

  postgres:
    image: postgres:bullseye
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxify_alpha
    volumes:
      - fluxify_pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxify_alpha"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fluxify_net

  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: valkey
    restart: unless-stopped
    networks:
      - fluxify_net

  nats:
    image: nats:latest
    container_name: nats
    # -js enables JetStream, which the compile pipeline REQUIRES: the compile
    # work queue is a JetStream stream and compiled routes live in a KV bucket
    # (KV is built on JetStream). Without it the compiler cannot start and
    # workers have nothing to pull.
    # Single-token auth; the token must match NATS_TOKEN in .env.
    command: ["-js", "--store_dir", "/data", "--auth", "fluxify_nats_token"]
    volumes:
      # Compiled artifacts survive a NATS restart. They are rebuilt from the
      # database at compiler startup anyway, so this is a warm-start, not a
      # source of truth.
      - fluxify_nats_volume:/data
    networks:
      - fluxify_net

volumes:
  fluxify_pg_volume:
  fluxify_nats_volume:

networks:
  fluxify_net:
    # Pin the real network name so it isn't prefixed with the compose project
    # name — keeps it predictable if you ever set --providers.docker.network.
    name: fluxify_net
    driver: bridge
