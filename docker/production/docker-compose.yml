# ==============================================================================
# Fluxify PRODUCTION — scale-out stack.
#   admin        : control plane (server API + web UI + AI gateway). Runs DB
#                  migrations, and hosts the compiler that fills the NATS KV
#                  bucket.
#   orchestrator : creates and removes the worker containers. Holds the Docker
#                  socket; runs no user code.
#   traefik      : edge reverse proxy. Chosen over Caddy because it discovers
#                  worker containers automatically from Docker labels and
#                  load-balances across them with zero static config.
#
#   docker compose -f docker/production/docker-compose.yml up -d
#
# Routing (Traefik):
#   /_/admin*  -> admin (its internal proxy splits ui / api / ai)
#   everything else -> the worker nodes the orchestrator created
#
# ------------------------------------------------------------------------------
# WHERE THE WORKERS WENT
#
# There is no `worker` service here any more. Workers are claimed, not
# declared: an operator says "this project wants a node of this type" and the
# orchestrator creates the containers for it. Compose and the orchestrator both
# managing the same containers would mean two controllers fighting over one
# resource, so ownership is split cleanly:
#
#   compose owns infra   — nats, postgres, valkey, traefik, admin, orchestrator
#   orchestrator owns    — every worker node
#
# A fresh stack still serves traffic: admin seeds one catch-all claim (one node,
# type `both`, every project) when no claim exists, which is exactly what the
# old `worker` service was. Set ORCHESTRATOR_SEED_DEFAULT_CLAIM=false to start
# with none.
#
#   HAZARD: `docker compose ... down --remove-orphans` deletes the
#   orchestrator-spawned workers, because compose does not know they were never
#   its containers. They come back within a reconcile pass (5s) once the
#   orchestrator is running again.
#
# ------------------------------------------------------------------------------
# Required in docker/production/.env, on top of the usual settings:
#   MASTER_ENCRYPTION_KEY       — shared by admin and workers; config artifacts
#                                 are encrypted with it in KV
#   ORCHESTRATOR_WORKER_IMAGE   — the worker image the orchestrator creates
#                                 containers from. It is the ONLY image it will
#                                 ever use, which is what keeps an image name
#                                 from arriving out of a database row
# ==============================================================================
services:
  traefik:
    image: traefik:v3.7.8
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # Explicit socket endpoint (the v3 default; stated for clarity).
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      # Dashboard + access logs for debugging routing (see :8081).
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "8080:80"
      - "8081:8080" # Traefik dashboard — http://localhost:8081/dashboard/
    volumes:
      # Read-only socket access so Traefik can watch service labels.
      # On Docker Desktop (Windows/Mac) this path is proxied and works as-is.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fluxify_net

  admin:
    # image: ghcr.io/fluxify-rest/fluxify-admin:alpha
    build:
      context: ../..
      dockerfile: docker/admin/Dockerfile
    container_name: fluxify-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Control plane only — the worker service serves user API traffic.
      ENABLE_ADMIN: "true"
      ENABLE_BUILTIN_WORKER: "false"
    # Test suites run user-authored code in child processes of THIS container,
    # so it needs a ceiling. Descriptors are also capped per child at spawn time
    # and this is the backstop for a fleet of them; memory is capped ONLY here.
    # A per-child `ulimit -v` is not an option — it bounds address space, which
    # JSC reserves ~129 GB of, so any usable value aborts Bun at startup.
    # A Dockerfile cannot set either — ulimits and memory are runtime settings.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      nats:
        condition: service_started
    labels:
      - traefik.enable=true
      - "traefik.http.routers.admin.rule=PathPrefix(`/_/admin`)"
      - traefik.http.routers.admin.priority=100
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.services.admin.loadbalancer.server.port=8080
    networks:
      - fluxify_net

  # ---------------------------------------------------------------------------
  # Orchestrator — owns the worker pool.
  #
  # Every 5 seconds it reads the claims, works out which worker containers
  # should exist, and creates or drains containers until the host agrees. It
  # stamps the Traefik labels the `worker` service used to carry, so nodes are
  # served automatically as they come and go.
  #
  # It touches only containers labelled `fluxify.managed-by=orchestrator` — the
  # daemon applies that filter, so nothing else on this host is even visible to
  # it. Two replicas would fight, so they do not: one holds a lease in NATS KV
  # and reconciles, any other stands by and takes over within the lease TTL.
  #
  # The socket is mounted WRITABLE (unlike Traefik's, which is read-only) —
  # creating a container is a write. That makes this process root-equivalent on
  # the host, which is why the image it uses comes from the environment below
  # and never from the database.
  # ---------------------------------------------------------------------------
  orchestrator:
    # image: ghcr.io/fluxify-rest/fluxify-orchestrator:alpha
    build:
      context: ../..
      dockerfile: docker/orchestrator/Dockerfile
    container_name: fluxify-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The only image it may create a container from.
      ORCHESTRATOR_WORKER_IMAGE: "${ORCHESTRATOR_WORKER_IMAGE:-ghcr.io/fluxify-rest/fluxify-worker:alpha}"
      # Workers must land on this network, or Traefik and NATS cannot reach them.
      ORCHESTRATOR_NETWORK: fluxify_net
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      # It reads claims, the pool ceiling and trigger groups from Postgres, and
      # waits for admin's migrations rather than exiting on a fresh stack.
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      admin:
        condition: service_started
    networks:
      - fluxify_net

  postgres:
    image: postgres:bullseye
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxify_alpha
    volumes:
      - fluxify_pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxify_alpha"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fluxify_net

  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: valkey
    restart: unless-stopped
    networks:
      - fluxify_net

  nats:
    # Pinned: schedules (ADR-51) need 2.14+ for cron, @every, predefined
    # aliases and timezones. On an older server a scheduled trigger is accepted
    # and simply never fires.
    image: nats:2.14
    container_name: nats
    # -js enables JetStream, which the compile pipeline REQUIRES: the compile
    # work queue is a JetStream stream and compiled routes live in a KV bucket
    # (KV is built on JetStream). Without it the compiler cannot start and
    # workers have nothing to pull.
    # Single-token auth; the token must match NATS_TOKEN in .env.
    command: ["-js", "--store_dir", "/data", "--auth", "fluxify_nats_token"]
    volumes:
      # Compiled artifacts survive a NATS restart. They are rebuilt from the
      # database at compiler startup anyway, so this is a warm-start, not a
      # source of truth.
      - fluxify_nats_volume:/data
    networks:
      - fluxify_net

volumes:
  fluxify_pg_volume:
  fluxify_nats_volume:

networks:
  fluxify_net:
    # Pin the real network name so it isn't prefixed with the compose project
    # name — keeps it predictable if you ever set --providers.docker.network.
    name: fluxify_net
    driver: bridge
