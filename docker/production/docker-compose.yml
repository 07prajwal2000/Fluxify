# ==============================================================================
# Fluxify PRODUCTION — scale-out stack.
#   admin   : control plane (server API + web UI + AI gateway). Runs DB
#             migrations, and hosts the compiler that fills the NATS KV bucket.
#   worker  : compiled request executor, 2 replicas, serving ALL projects
#             (WORKER_PROJECT_ID=*). No database connection.
#   traefik : edge reverse proxy. Chosen over Caddy because it discovers the
#             worker replicas automatically from Docker labels and load-balances
#             across them with zero static config.
#
#   docker compose -f docker/production/docker-compose.yml up -d
#
# Routing (Traefik):
#   /_/admin*  -> admin (its internal proxy splits ui / api / ai)
#   everything else -> worker replicas
#
# Required in docker/production/.env, on top of the usual settings:
#   MASTER_ENCRYPTION_KEY       — shared by admin and workers; config artifacts
#                                 are encrypted with it in KV
# ==============================================================================
services:
  traefik:
    image: traefik:v3.7.8
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # Explicit socket endpoint (the v3 default; stated for clarity).
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      # Dashboard + access logs for debugging routing (see :8081).
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "8080:80"
      - "8081:8080" # Traefik dashboard — http://localhost:8081/dashboard/
    volumes:
      # Read-only socket access so Traefik can watch service labels.
      # On Docker Desktop (Windows/Mac) this path is proxied and works as-is.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fluxify_net

  admin:
    # image: ghcr.io/fluxify-rest/fluxify-admin:latest
    build:
      context: ../..
      dockerfile: docker/admin/Dockerfile
    container_name: fluxify-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Control plane only — the worker service serves user API traffic.
      ENABLE_ADMIN: "true"
      ENABLE_BUILTIN_WORKER: "false"
    # Test suites run user-authored code in child processes of THIS container,
    # so it needs a ceiling. Descriptors are also capped per child at spawn time
    # and this is the backstop for a fleet of them; memory is capped ONLY here.
    # A per-child `ulimit -v` is not an option — it bounds address space, which
    # JSC reserves ~129 GB of, so any usable value aborts Bun at startup.
    # A Dockerfile cannot set either — ulimits and memory are runtime settings.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      nats:
        condition: service_started
    labels:
      - traefik.enable=true
      - "traefik.http.routers.admin.rule=PathPrefix(`/_/admin`)"
      - traefik.http.routers.admin.priority=100
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.services.admin.loadbalancer.server.port=8080
    networks:
      - fluxify_net

  # ---------------------------------------------------------------------------
  # Compiled worker — ONE service, 2 replicas, serving every project.
  #
  # WORKER_PROJECT_ID=* means this worker pulls artifacts for all projects from
  # NATS KV, so a single service covers the whole stack. Per-project isolation
  # is a service per project (replicas of one service share an environment, so
  # they cannot differ) — see git history for that two-project shape.
  #
  # Catch-all path route: user API routes own the whole path space, so the
  # worker takes everything admin's higher-priority /_/admin rule does not.
  #
  # These containers never connect to Postgres — no PG_URL, and no dependency on
  # it. They need NATS (JetStream + KV) and Redis only.
  # ---------------------------------------------------------------------------
  worker:
    # image: ghcr.io/fluxify-rest/fluxify-worker-compiled:latest
    build:
      context: ../..
      dockerfile: docker/worker-compiled/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # `*` — every project, rather than one uuid per worker service.
      WORKER_PROJECT_ID: "*"
      # route | workflow | both (default). Every worker of a project must agree;
      # two modes on one project is refused at boot rather than run twice.
      WORKER_MODE: "${WORKER_MODE:-both}"
      INTEGRATION_TIMEOUT_POLICY_IN_SEC: "${INTEGRATION_TIMEOUT_POLICY_IN_SEC:-450}"
    # No container_name: replicas each need a unique name.
    deploy:
      replicas: 2
    # These containers run user-authored route code. A ceiling per replica so one
    # runaway execution process cannot take the host down.
    mem_limit: 1g
    pids_limit: 512
    depends_on:
      # admin runs the compiler, which fills KV. Workers idle harmlessly until
      # artifacts appear, and the readiness probe keeps traffic off them.
      admin:
        condition: service_started
      valkey:
        condition: service_started
      nats:
        condition: service_started
    labels:
      - traefik.enable=true
      - "traefik.http.routers.worker.rule=PathPrefix(`/`)"
      - traefik.http.routers.worker.priority=1
      - traefik.http.routers.worker.entrypoints=web
      - traefik.http.services.worker.loadbalancer.server.port=5600
      # Health is on 5601, served by the supervisor. Checking 5600 would hit an
      # isolated execution process and does not describe supervisor health.
      - traefik.http.services.worker.loadbalancer.healthcheck.path=/_/admin/api/healthchecks/ready
      - traefik.http.services.worker.loadbalancer.healthcheck.port=5601
      - traefik.http.services.worker.loadbalancer.healthcheck.interval=10s
    networks:
      - fluxify_net

  postgres:
    image: postgres:bullseye
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxify_alpha
    volumes:
      - fluxify_pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxify_alpha"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fluxify_net

  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: valkey
    restart: unless-stopped
    networks:
      - fluxify_net

  nats:
    # Pinned: schedules (ADR-51) need 2.14+ for cron, @every, predefined
    # aliases and timezones. On an older server a scheduled trigger is accepted
    # and simply never fires.
    image: nats:2.14
    container_name: nats
    # -js enables JetStream, which the compile pipeline REQUIRES: the compile
    # work queue is a JetStream stream and compiled routes live in a KV bucket
    # (KV is built on JetStream). Without it the compiler cannot start and
    # workers have nothing to pull.
    # Single-token auth; the token must match NATS_TOKEN in .env.
    command: ["-js", "--store_dir", "/data", "--auth", "fluxify_nats_token"]
    volumes:
      # Compiled artifacts survive a NATS restart. They are rebuilt from the
      # database at compiler startup anyway, so this is a warm-start, not a
      # source of truth.
      - fluxify_nats_volume:/data
    networks:
      - fluxify_net

volumes:
  fluxify_pg_volume:
  fluxify_nats_volume:

networks:
  fluxify_net:
    # Pin the real network name so it isn't prefixed with the compose project
    # name — keeps it predictable if you ever set --providers.docker.network.
    name: fluxify_net
    driver: bridge
