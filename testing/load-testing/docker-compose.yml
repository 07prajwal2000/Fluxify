# Load-test overlay for docker/production/docker-compose.yml.
# Builds every image from the local checkout and caps each container at
# 1 CPU / 1 GiB. Orchestrated workers get the same cap from the default claim.
#
#   cp docker/production/env.example docker/production/.env
#   (set ORCHESTRATOR_WORKER_IMAGE=fluxify-worker:local in that .env)
#   docker compose -f docker/production/docker-compose.yml -f testing/load-testing/docker-compose.yml up -d --build
x-limits: &limits
  cpus: 1
  mem_limit: 1g
  memswap_limit: 1g

services:
  traefik:
    <<: *limits
    cpus: 4 # the edge was the bottleneck at 1 CPU (~90% busy at 3.3k req/s)
    # Same flags as the production file minus --accesslog: a line per request
    # costs memory and CPU under load. A `command` list is replaced, not merged.
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
  admin: { <<: *limits }
  orchestrator: { <<: *limits }
  worker-dev:
    <<: *limits
    image: fluxify-worker:local
    build:
      context: ../..
      dockerfile: docker/worker-compiled/Dockerfile
  postgres: { <<: *limits }
  valkey: { <<: *limits }
  nats: { <<: *limits }

  # URL shortener test project's own data stores (not Fluxify's control plane).
  # On fluxify_net: reach them from Fluxify as lt-urlshortener-postgres:5432 and
  # lt-urlshortener-valkey:6379.
  lt-urlshortener-postgres:
    image: postgres:bullseye
    container_name: lt-urlshortener-postgres
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fluxify_net
  lt-urlshortener-valkey:
    image: valkey/valkey:9.0-alpine
    container_name: lt-urlshortener-valkey
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - fluxify_net

  # Hand-coded twin of the Fluxify routes (url-shortener/server), built like a
  # production image and served through the same Traefik at Host ts.localhost.
  lt-urlshortener-ts:
    <<: *limits
    build:
      context: ../../testing/load-testing/url-shortener
      dockerfile: server/Dockerfile
    image: lt-urlshortener-ts:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PG_URL: postgres://postgres:postgres@lt-urlshortener-postgres:5432/urlshortener
      REDIS_URL: redis://lt-urlshortener-valkey:6379
      BASE_URL: http://ts.localhost:8080
    # Scale with `--scale lt-urlshortener-ts=2`; Traefik balances the replicas.
    # For direct access without Traefik, add `ports: ["3100:3000"]` and keep one replica.
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lt-ts.rule=Host(`ts.localhost`)"
      - traefik.http.routers.lt-ts.priority=100
      - traefik.http.routers.lt-ts.entrypoints=web
      - traefik.http.services.lt-ts.loadbalancer.server.port=3000
    depends_on:
      lt-urlshortener-postgres:
        condition: service_healthy
      lt-urlshortener-valkey:
        condition: service_started
    networks:
      - fluxify_net

  # Bun twin that uses Fluxify's own PostgresAdapter + RedisIntegration
  # (url-shortener/server-adapter). Served at Host adapter.localhost.
  lt-urlshortener-adapter:
    <<: *limits
    build:
      context: ../../testing/load-testing/url-shortener
      dockerfile: server-adapter/Dockerfile
    image: lt-urlshortener-adapter:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PG_URL: postgres://postgres:postgres@lt-urlshortener-postgres:5432/urlshortener
      REDIS_URL: redis://lt-urlshortener-valkey:6379
      BASE_URL: http://adapter.localhost:8080
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lt-adapter.rule=Host(`adapter.localhost`)"
      - traefik.http.routers.lt-adapter.priority=100
      - traefik.http.routers.lt-adapter.entrypoints=web
      - traefik.http.services.lt-adapter.loadbalancer.server.port=3000
    depends_on:
      lt-urlshortener-postgres:
        condition: service_healthy
      lt-urlshortener-valkey:
        condition: service_started
    networks:
      - fluxify_net

  # Same as lt-urlshortener-adapter but routed by Fluxify's routing trie instead of Hono
  # (server-adapter/index-trie.ts). Served at Host trie.localhost.
  lt-urlshortener-trie:
    <<: *limits
    build:
      context: ../../testing/load-testing/url-shortener
      dockerfile: server-adapter/Dockerfile
      args:
        BUNDLE: dist-trie/index-trie.js
    image: lt-urlshortener-trie:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PG_URL: postgres://postgres:postgres@lt-urlshortener-postgres:5432/urlshortener
      REDIS_URL: redis://lt-urlshortener-valkey:6379
      BASE_URL: http://trie.localhost:8080
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lt-trie.rule=Host(`trie.localhost`)"
      - traefik.http.routers.lt-trie.priority=100
      - traefik.http.routers.lt-trie.entrypoints=web
      - traefik.http.services.lt-trie.loadbalancer.server.port=3000
    depends_on:
      lt-urlshortener-postgres:
        condition: service_healthy
      lt-urlshortener-valkey:
        condition: service_started
    networks:
      - fluxify_net

  # The Fluxify route graphs compiled from url-shortener/fluxify-raw-routes (run
  # `bun compile.ts` in fluxify-worker/), served by the worker image's own execution
  # process through a minimal harness. Nothing is built: the harness and artifacts are
  # mounted. Served at Host fw.localhost; scale with `--scale lt-urlshortener-fw=2`.
  lt-urlshortener-fw:
    <<: *limits
    image: fluxify-worker:local
    entrypoint: ["/usr/local/bin/bun", "/h/harness.ts"]
    restart: unless-stopped
    # the image checks the supervisor's health port, which the harness does not run
    healthcheck:
      disable: true
    volumes:
      - ../../testing/load-testing/url-shortener/fluxify-worker:/h:ro
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lt-fw.rule=Host(`fw.localhost`)"
      - traefik.http.routers.lt-fw.priority=100
      - traefik.http.routers.lt-fw.entrypoints=web
      - traefik.http.services.lt-fw.loadbalancer.server.port=5600
    depends_on:
      lt-urlshortener-postgres:
        condition: service_healthy
      lt-urlshortener-valkey:
        condition: service_started
    networks:
      - fluxify_net

  # The compiled Fluxify route graphs run with only the routing trie, instantiateCompiled and
  # the slim adapters around them (server-adapter/index-compiled.ts): no dispatch, validation
  # or worker context. Nothing is built: the bundle and artifacts are mounted into the worker
  # image, only for its Bun. Served at Host cp.localhost.
  lt-urlshortener-compiled:
    <<: *limits
    image: fluxify-worker:local
    entrypoint: ["/usr/local/bin/bun", "/c/index-compiled.js"]
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      ARTIFACTS: /h/dist/${LT_ARTIFACTS:-artifacts.json}
      PG_URL: postgres://postgres:postgres@lt-urlshortener-postgres:5432/urlshortener
      REDIS_URL: redis://lt-urlshortener-valkey:6379
    working_dir: /c
    volumes:
      - ../../testing/load-testing/url-shortener/fluxify-worker:/h:ro
      - ../../testing/load-testing/url-shortener/server-adapter/dist-compiled:/c:ro
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lt-cp.rule=Host(`cp.localhost`)"
      - traefik.http.routers.lt-cp.priority=100
      - traefik.http.routers.lt-cp.entrypoints=web
      - traefik.http.services.lt-cp.loadbalancer.server.port=3000
    depends_on:
      lt-urlshortener-postgres:
        condition: service_healthy
      lt-urlshortener-valkey:
        condition: service_started
    networks:
      - fluxify_net

  # Node.js twin of the Bun server (url-shortener/server-node): same routes, `pg`
  # instead of Bun SQL. Served at Host node.localhost; scale with
  # `--scale lt-urlshortener-node=2`.
  lt-urlshortener-node:
    <<: *limits
    build:
      context: ../../testing/load-testing/url-shortener
      dockerfile: server-node/Dockerfile
    image: lt-urlshortener-node:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PG_URL: postgres://postgres:postgres@lt-urlshortener-postgres:5432/urlshortener
      REDIS_URL: redis://lt-urlshortener-valkey:6379
      BASE_URL: http://node.localhost:8080
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lt-node.rule=Host(`node.localhost`)"
      - traefik.http.routers.lt-node.priority=100
      - traefik.http.routers.lt-node.entrypoints=web
      - traefik.http.services.lt-node.loadbalancer.server.port=3000
    depends_on:
      lt-urlshortener-postgres:
        condition: service_healthy
      lt-urlshortener-valkey:
        condition: service_started
    networks:
      - fluxify_net
