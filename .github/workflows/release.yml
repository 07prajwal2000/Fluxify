name: Release

# A version tag (v0.1.0-alpha.1, v1.2.3) is the whole release trigger: it runs
# the full suite, then builds and pushes admin, orchestrator and worker and
# publishes the GitHub release.
#
# Three images, one per process a production deployment runs. Kit is not here on
# purpose: it is the single-container evaluation build and ships as a rolling
# `nightly` from main (nightly.yml).
on:
  push:
    tags: ["v*"]

# Releases are never cancelled: a half-pushed image set is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  checks:
    if: github.repository_owner == 'Fluxify-rest'
    uses: ./.github/workflows/checks.yml

  tests:
    if: github.repository_owner == 'Fluxify-rest'
    uses: ./.github/workflows/tests.yml
    with:
      full: true

  build-and-push-release:
    needs: [checks, tests]
    # No `always()`, and deliberately not the `!contains(... 'failure')` form:
    # that one counts a SKIPPED job as fine, which is how a release could publish
    # images no test ever ran against. With the default rule both calls above must
    # have succeeded, and tests.yml fails if any of its jobs was skipped.
    if: github.repository_owner == 'Fluxify-rest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing must not leave the other two unpushed and unexplained:
      # every image is attempted, and the release notes job below waits for all
      # of them to succeed before anything is announced.
      fail-fast: false
      matrix:
        include:
          - image: fluxify-admin
            dockerfile: docker/admin/Dockerfile
          - image: fluxify-orchestrator
            dockerfile: docker/orchestrator/Dockerfile
          # The published name drops `-compiled`: there is one worker now, and
          # the graph interpreter it was named against is gone.
          - image: fluxify-worker
            dockerfile: docker/worker-compiled/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and tags
        id: image
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          repo="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/$IMAGE"
          tags="$repo:$TAG"
          # A pre-release tag never moves `latest`: anything with a hyphen after
          # the version is a pre-release by semver, so an alpha cannot become
          # what an unpinned `docker pull` gets. It moves its own channel tag
          # instead — v0.1.0-alpha.2 becomes `:alpha`, v1.0.0-rc.1 `:rc` — which
          # is what the compose files track until a stable release exists.
          case "$TAG" in
            *-*)
              channel="${TAG#*-}"
              tags="$tags"$'\n'"$repo:${channel%%.*}"
              ;;
            *) tags="$tags"$'\n'"$repo:latest" ;;
          esac
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          # The Dockerfiles own their OCI labels; these three are the only
          # values they cannot know about themselves.
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # The GitHub release is published last, and only if all three images pushed:
  # release notes pointing at tags nobody can pull are worse than no notes.
  release:
    needs: build-and-push-release
    if: success() && github.repository_owner == 'Fluxify-rest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The chart is pushed to ghcr next to the images.
      packages: write
      # To rebuild the docs, so their install commands name this release.
      actions: write
    steps:
      # Full history: generated notes are a diff against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      # The chart's version is the tag's, and its images are the ones this
      # release just pushed. fluxify.yaml is rendered from that same package,
      # so the two can never disagree about a default.
      - name: Package the chart and render fluxify.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build deploy/helm/fluxify
          helm package deploy/helm/fluxify --version "${TAG#v}" --app-version "$TAG" -d dist
          helm template fluxify "dist/fluxify-${TAG#v}.tgz" -n fluxify --include-crds --no-hooks             -f deploy/helm/demo-values.yaml > dist/fluxify.yaml

      - name: Push the chart to ghcr
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push "dist/fluxify-${TAG#v}.tgz" "oci://ghcr.io/$owner/charts"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it alone"
            exit 0
          fi

          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          notes=$(mktemp)
          {
            echo '### Images'
            echo
            echo '```bash'
            for image in fluxify-admin fluxify-orchestrator fluxify-worker; do
              echo "docker pull ghcr.io/$owner/$image:$TAG"
            done
            echo '```'
            echo
            echo "Deploy them with [docker/production/docker-compose.yml](https://github.com/${{ github.repository }}/blob/$TAG/docker/production/docker-compose.yml)."
            echo
            echo '### Kubernetes'
            echo
            echo '```bash'
            echo "helm install fluxify oci://ghcr.io/$owner/charts/fluxify --version ${TAG#v} -n fluxify --create-namespace"
            echo '```'
            echo
            echo 'To try it without Helm, `fluxify.yaml` below runs one of everything —'
            echo 'see [Kubernetes](https://docs.fluxify.rest/deployments/kubernetes/install).'
          } > "$notes"

          # A pre-release is marked as one, and does not become the repo's
          # "Latest release": an alpha must be opt-in.
          flags=""
          case "$TAG" in
            *-*)
              flags="--prerelease --latest=false"
              {
                echo
                echo '> [!WARNING]'
                echo "> Pre-release. No Fluxify license issuer exists before v1.0, so enterprise"
                echo "> features verify against a key you sign yourself —"
                echo "> see [self-signed licenses](https://docs.fluxify.rest/deployments/self-signed-license)."
              } >> "$notes"
              ;;
          esac

          gh release create "$TAG" dist/fluxify-*.tgz dist/fluxify.yaml \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            --notes-file "$notes" \
            $flags

      # A release made with this job's token starts no other workflow on its
      # own (GitHub's guard against loops), so the docs are started by name.
      - name: Rebuild the docs for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gh-pages.yml --ref main
