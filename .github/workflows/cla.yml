# Asks first-time contributors to sign the CLA by commenting on their PR.
# Signatures are recorded in a JSON file in this repository, so there is no
# third-party service holding the record.
#
# Contributors sign by commenting:
#   I have read the CLA Document and I hereby sign the CLA
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Run on PR events, or only on the signature comment itself — not on every
    # comment in every issue.
    if: |
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/Fluxify-rest/Fluxify/blob/main/CLA.md"
          branch: main
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Thanks for your contribution! 🎉

            Before we can merge this, we need you to sign our
            [Contributor License Agreement](https://github.com/Fluxify-rest/Fluxify/blob/main/CLA.md).
            You keep ownership of your work — this just lets the project
            distribute it and make licensing decisions without having to
            contact every contributor individually.

            To sign, reply to this thread with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"
