name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    # A version tag (v0.1.0-alpha.1, v1.2.3) is the whole release trigger: it
    # runs the full suite, then builds and pushes admin, orchestrator and worker
    # and publishes the GitHub release.
    tags: ["v*"]
  pull_request:

# A superseded PR run is wasted minutes. Releases and main are never cancelled:
# a half-pushed image set is worse than a slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.2"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # On a tag push there is no "before" commit to diff against, so the
      # filters would come back false and a release would skip most of its
      # tests. A release tests everything, always.
      lib: ${{ steps.filter.outputs.lib == 'true' || startsWith(github.ref, 'refs/tags/v') }}
      blocks: ${{ steps.filter.outputs.blocks == 'true' || startsWith(github.ref, 'refs/tags/v') }}
      server: ${{ steps.filter.outputs.server == 'true' || startsWith(github.ref, 'refs/tags/v') }}
      portal: ${{ steps.filter.outputs.portal == 'true' || startsWith(github.ref, 'refs/tags/v') }}
      ai-gateway: ${{ steps.filter.outputs.ai-gateway == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        # Not run on a tag at all: there is nothing to diff against, and a
        # release does not read the answer. Skipped leaves the outputs empty,
        # which the tag clause below already resolves to true.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          filters: |
            lib:
              - 'packages/lib/**'
            blocks:
              - 'packages/blocks/**'
              - 'packages/adapters/**'
              - 'packages/lib/**'
            # Every package except packages/components, which is portal-only
            # UI. Listed, not negated: paths-filter ORs its rules, so a lone
            # '!packages/components/**' would match nearly every file.
            server-packages: &server-packages
              - 'packages/adapters/**'
              - 'packages/blocks/**'
              - 'packages/common/**'
              - 'packages/lib/**'
            server:
              - 'apps/server/**'
              - 'apps/ai-gateway/**'
              - *server-packages
            portal:
              - 'apps/portal/**'
              - 'apps/ai-gateway/**'
              - 'apps/server/**'
              - 'packages/**'
            ai-gateway:
              - 'apps/ai-gateway/**'
              - 'apps/server/**'
              - *server-packages

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Run Biome (format, lint, import order, secrets)
        run: bun run lint --reporter=github
      - name: Build Portal (generates TanStack route tree for typecheck)
        run: bun run build --filter=@fluxify/portal
      - name: Run Typecheck
        run: bun run typecheck
      - name: Run Analyzer
        run: bun run analyze

  # The chart is the one source of every Kubernetes default, and a release
  # renders fluxify.yaml from it: both ways of installing must render.
  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Fetch NATS and Valkey
        run: helm dependency build deploy/helm/fluxify
      - name: Lint
        run: helm lint deploy/helm/fluxify --set postgres.bundled=true
      - name: Render a Helm install and fluxify.yaml
        run: |
          set -euo pipefail
          helm template fluxify deploy/helm/fluxify -n fluxify \
            --set secret.values.PG_URL=postgres://u:p@db:5432/fluxify > /dev/null
          helm template fluxify deploy/helm/fluxify -n fluxify --include-crds --no-hooks \
            -f deploy/helm/demo-values.yaml > /dev/null

  # Secret scanning is its own job: Biome cannot see credentials in history,
  # and a pre-commit hook can be skipped. It scans only the commits this run
  # adds, so a secret already in history does not fail every later PR. A tag is
  # not scanned: it points at a commit main already checked.
  secret-scan:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "$base/$tarball" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan the commits added by this run
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] && range="-1 $PUSH_AFTER" || range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="-1 $PUSH_AFTER" ;;
          esac
          ./gitleaks git --redact --no-banner --log-opts="$range" .

  test-packages-lib:
    needs: detect-changes
    if: needs.detect-changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Run Lib Tests
        run: bun run test:lib

  test-packages-blocks:
    needs: detect-changes
    if: needs.detect-changes.outputs.blocks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Generate MASTER_ENCRYPTION_KEY
        run: echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - name: Run Blocks Tests
        run: bun run test:blocks

  # Integration and e2e jobs are CI-only (the pre-commit hook no longer runs
  # them), so they share the server filter rather than a narrower one.
  test-packages-adapters:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Generate MASTER_ENCRYPTION_KEY
        run: echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - name: Run Adapters Tests
        run: bun run test:adapters

  test-e2e-graphs:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Generate MASTER_ENCRYPTION_KEY
        run: echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - name: Run Graph E2E Tests
        run: bun run test:e2e
        env:
          CI: "true"

  test-apps-server-unit:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Generate MASTER_ENCRYPTION_KEY
        run: echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - name: Run Server Unit Tests
        run: bun run test:server:unit

  test-apps-server-integration:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Generate MASTER_ENCRYPTION_KEY
        run: echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - name: Run Server Integration Tests
        run: bun run test:server:integration

  test-apps-portal:
    needs: detect-changes
    if: needs.detect-changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Run Portal Tests
        run: bun run test:portal

  test-apps-ai-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.ai-gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Generate MASTER_ENCRYPTION_KEY
        run: echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - name: Run AI Gateway Tests
        run: bun run test:ai-gateway

  # Kit — the single-container evaluation build — is the only image published
  # from main, as a rolling `nightly`. It carries no version tags: the release
  # job below ships the three images a real deployment runs.
  build-and-push:
    needs: [lint, secret-scan, test-packages-lib, test-packages-blocks, test-packages-adapters, test-e2e-graphs, test-apps-server-unit, test-apps-server-integration, test-apps-portal, test-apps-ai-gateway]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'Fluxify-rest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute nightly timestamp (UTC, YY-MM-DD-HHMM)
        id: ts
        run: |
          echo "stamp=$(date -u +'%y-%m-%d-%H%M')" >> $GITHUB_OUTPUT
          echo "iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Lowercase Repo Owner
        id: owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Kit (nightly)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/kit/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/fluxify-kit:nightly
            ghcr.io/${{ steps.owner.outputs.owner }}/fluxify-kit:nightly-${{ steps.ts.outputs.stamp }}
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            VERSION=nightly-${{ steps.ts.outputs.stamp }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.ts.outputs.iso }}
          cache-from: type=gha,scope=fluxify-kit
          cache-to: type=gha,scope=fluxify-kit,mode=max

  # ============================================================================
  # RELEASE — version tags only (v0.1.0-alpha.1, v1.2.3).
  #
  # Three images, one per process a production deployment runs. Kit is not here
  # on purpose: it is the single-container evaluation build and ships as a
  # rolling `nightly` from main, above.
  # ============================================================================
  build-and-push-release:
    # `detect-changes` is a dependency even though a release ignores its answer:
    # it decides whether the test jobs run at all, so a release that did not
    # wait for it could publish behind a filter that errored.
    needs: [detect-changes, lint, helm-chart, test-packages-lib, test-packages-blocks, test-packages-adapters, test-e2e-graphs, test-apps-server-unit, test-apps-server-integration, test-apps-portal, test-apps-ai-gateway]
    # No `always()`, and deliberately not the `!contains(needs.*.result, 'failure')`
    # form the nightly job uses: that one counts a SKIPPED job as fine, which is
    # how a release could publish images no test ever ran against. With the
    # default rule, every job above must have actually succeeded — a skip stops
    # the release the same as a failure.
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository_owner == 'Fluxify-rest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing must not leave the other two unpushed and unexplained:
      # every image is attempted, and the release notes job below waits for all
      # of them to succeed before anything is announced.
      fail-fast: false
      matrix:
        include:
          - image: fluxify-admin
            dockerfile: docker/admin/Dockerfile
          - image: fluxify-orchestrator
            dockerfile: docker/orchestrator/Dockerfile
          # The published name drops `-compiled`: there is one worker now, and
          # the graph interpreter it was named against is gone.
          - image: fluxify-worker
            dockerfile: docker/worker-compiled/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and tags
        id: image
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          repo="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/$IMAGE"
          tags="$repo:$TAG"
          # A pre-release tag never moves `latest`: anything with a hyphen after
          # the version is a pre-release by semver, so an alpha cannot become
          # what an unpinned `docker pull` gets. It moves its own channel tag
          # instead — v0.1.0-alpha.2 becomes `:alpha`, v1.0.0-rc.1 `:rc` — which
          # is what the compose files track until a stable release exists.
          case "$TAG" in
            *-*)
              channel="${TAG#*-}"
              tags="$tags"$'\n'"$repo:${channel%%.*}"
              ;;
            *) tags="$tags"$'\n'"$repo:latest" ;;
          esac
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          # The Dockerfiles own their OCI labels; these three are the only
          # values they cannot know about themselves.
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # The GitHub release is published last, and only if all three images pushed:
  # release notes pointing at tags nobody can pull are worse than no notes.
  release:
    needs: build-and-push-release
    if: success() && startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'Fluxify-rest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The chart is pushed to ghcr next to the images.
      packages: write
      # To rebuild the docs, so their install commands name this release.
      actions: write
    steps:
      # Full history: generated notes are a diff against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      # The chart's version is the tag's, and its images are the ones this
      # release just pushed. fluxify.yaml is rendered from that same package,
      # so the two can never disagree about a default.
      - name: Package the chart and render fluxify.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          helm dependency build deploy/helm/fluxify
          helm package deploy/helm/fluxify --version "${TAG#v}" --app-version "$TAG" -d dist
          helm template fluxify "dist/fluxify-${TAG#v}.tgz" -n fluxify --include-crds --no-hooks             -f deploy/helm/demo-values.yaml > dist/fluxify.yaml

      - name: Push the chart to ghcr
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push "dist/fluxify-${TAG#v}.tgz" "oci://ghcr.io/$owner/charts"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it alone"
            exit 0
          fi

          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          notes=$(mktemp)
          {
            echo '### Images'
            echo
            echo '```bash'
            for image in fluxify-admin fluxify-orchestrator fluxify-worker; do
              echo "docker pull ghcr.io/$owner/$image:$TAG"
            done
            echo '```'
            echo
            echo "Deploy them with [docker/production/docker-compose.yml](https://github.com/${{ github.repository }}/blob/$TAG/docker/production/docker-compose.yml)."
            echo
            echo '### Kubernetes'
            echo
            echo '```bash'
            echo "helm install fluxify oci://ghcr.io/$owner/charts/fluxify --version ${TAG#v} -n fluxify --create-namespace"
            echo '```'
            echo
            echo 'To try it without Helm, `fluxify.yaml` below runs one of everything —'
            echo 'see [Kubernetes](https://docs.fluxify.rest/deployments/kubernetes/install).'
          } > "$notes"

          # A pre-release is marked as one, and does not become the repo's
          # "Latest release": an alpha must be opt-in.
          flags=""
          case "$TAG" in
            *-*)
              flags="--prerelease --latest=false"
              {
                echo
                echo '> [!WARNING]'
                echo "> Pre-release. No Fluxify license issuer exists before v1.0, so enterprise"
                echo "> features verify against a key you sign yourself —"
                echo "> see [self-signed licenses](https://docs.fluxify.rest/deployments/self-signed-license)."
              } >> "$notes"
              ;;
          esac

          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            --notes-file "$notes" \
            $flags

      # A release made with this job's token starts no other workflow on its
      # own (GitHub's guard against loops), so the docs are started by name.
      - name: Rebuild the docs for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gh-pages.yml --ref main
