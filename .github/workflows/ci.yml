name: CI

# Pull requests and pushes to main: checks and path-filtered tests. Nothing here
# builds or publishes an image (see nightly.yml and release.yml). A manual run
# tests everything.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

# A superseded PR run is wasted minutes. Main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job is skipped on a fork: a fork's own runs are wasted minutes.
jobs:
  checks:
    if: github.repository_owner == 'Fluxify-rest'
    uses: ./.github/workflows/checks.yml

  tests:
    if: github.repository_owner == 'Fluxify-rest'
    uses: ./.github/workflows/tests.yml
    with:
      full: ${{ github.event_name == 'workflow_dispatch' }}
