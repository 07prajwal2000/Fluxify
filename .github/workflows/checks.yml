# Lint, typecheck, the Helm chart and the secret scan: the checks that need no
# test services. CI, the nightly Kit build and a release all run them.
name: Checks

on:
  workflow_call:

env:
  BUN_VERSION: "1.4.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Dependencies
        run: bun install
      - name: Run Biome (format, lint, import order, secrets)
        run: bun run lint --reporter=github
      - name: Check CI test gates match the monorepo dependencies
        run: bun run check:ci-gates
      - name: Build Portal (generates TanStack route tree for typecheck)
        run: bun run build --filter=@fluxify/portal
      - name: Run Typecheck
        run: bun run typecheck
      - name: Run Analyzer
        run: bun run analyze
      # A schema change without its migration would never reach an existing
      # database (#603). Generating from the committed schema must be a no-op.
      - name: Check every schema change has a migration
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bun run --cwd apps/server db:generate
          if [ -n "$(git status --porcelain apps/server/src/db/migrations)" ]; then
            git status --porcelain apps/server/src/db/migrations
            echo "::error::The database schema changed without a migration. Run 'bun run db:generate' and commit apps/server/src/db/migrations."
            exit 1
          fi

  # The chart is the one source of every Kubernetes default, and a release
  # renders fluxify.yaml from it: both ways of installing must render.
  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # Helm fetches a dependency only from a repository it was told about.
      - name: Fetch NATS and Valkey
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build deploy/helm/fluxify
      - name: Lint
        run: helm lint deploy/helm/fluxify --set postgres.bundled=true
      - name: Render a Helm install and fluxify.yaml
        run: |
          set -euo pipefail
          helm template fluxify deploy/helm/fluxify -n fluxify \
            --set secret.values.PG_URL=postgres://u:p@db:5432/fluxify > /dev/null
          helm template fluxify deploy/helm/fluxify -n fluxify --include-crds --no-hooks \
            -f deploy/helm/demo-values.yaml > /dev/null

  # Secret scanning is its own job: Biome cannot see credentials in history,
  # and a pre-commit hook can be skipped. It scans only the commits this run
  # adds, so a secret already in history does not fail every later PR. A tag is
  # not scanned: it points at a commit main already checked.
  secret-scan:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "$base/$tarball" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan the commits added by this run
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] && range="-1 $PUSH_AFTER" || range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="-1 $PUSH_AFTER" ;;
          esac
          ./gitleaks git --redact --no-banner --log-opts="$range" .
