name: publish-gh-pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**"
      - ".github/workflows/gh-pages.yml"

  # Allow manual trigger from the Actions tab. CI's release job also starts it
  # here, so the install commands name a new release as soon as it is out.
  workflow_dispatch:

# Grant write access so the action can push to gh-pages branch
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-progress runs if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.3"

jobs:
  build:
    if: github.repository == 'Fluxify-rest/Fluxify'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git-based lastUpdated timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      # Pre-releases count: before 1.0 every release is one. Newest first.
      - name: Find the releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --exclude-drafts --limit 50 --json tagName --jq '[.[].tagName] | join(" ")')
          echo "DOCS_RELEASES=$releases" >> "$GITHUB_ENV"
          echo "FLUXIFY_RELEASE_TAG=${releases%% *}" >> "$GITHUB_ENV"

      # Release builds never change. The script rebuilds them only when the
      # version list changes (a new release), so a push to main builds /nightly/ only.
      - name: Restore release builds
        uses: actions/cache@v4
        with:
          path: .docs-versions/releases
          key: docs-releases-${{ github.run_id }}
          restore-keys: docs-releases-

      # / is the newest release, /nightly/ is main, /<tag>/ the older releases
      - name: Build VitePress docs
        run: bun run docs:build:versions

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.repository == 'Fluxify-rest/Fluxify'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
