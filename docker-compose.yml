services:
  postgres:
    image: postgres:bullseye
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxify_alpha
    volumes:
      - fluxify_pg_volume:/var/lib/postgresql/data
    networks:
      - default
  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: valkey
    ports:
      - 6379:6379
    networks:
      - default
  nats:
    image: nats:latest
    container_name: nats
    # -js enables JetStream, which the compile pipeline REQUIRES: the compile
    # work queue is a JetStream stream and compiled routes live in a KV bucket
    # (KV is built on JetStream). Without it the compiler cannot start and the
    # worker has nothing to serve.
    # Single-token auth; must match NATS_TOKEN in the server env.
    command: ["-js", "--auth", "fluxify_nats_token", "--http_port", "8222"]
    ports:
      - 4222:4222 # client connections
      - 8222:8222 # monitoring
    networks:
      - default
  caddy:
    image: caddy:2.6.4-alpine
    container_name: caddy
    ports:
      - 8080:8080
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile
    networks:
      - default
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    ports:
      - 5080:5080
    environment:
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=Root@Example123
    networks:
      - default

  # =========================================================================
  # JAEGER (OpenTelemetry trace collector and trace UI)
  # =========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    ports:
      - 16686:16686 # Jaeger trace UI
      - 4317:4317 # OpenTelemetry Protocol (OTLP) over gRPC
      - 4318:4318 # OpenTelemetry Protocol (OTLP) over HTTP
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000 # Grafana UI
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports:
      - 9090:9090 # Prometheus UI and OTLP HTTP metrics receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - default

volumes:
  fluxify_pg_volume:
  grafana_data:
  prometheus_data:
networks:
  default:
    driver: bridge
