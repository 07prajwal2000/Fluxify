apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxify-admin
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fluxify.labels" . | nindent 4 }}
spec:
  # One: admin runs the migrations and the compiler.
  replicas: 1
  selector:
    matchLabels: { app: fluxify-admin }
  template:
    metadata:
      labels: { app: fluxify-admin }
      annotations: {{- include "fluxify.checksum" . | nindent 8 }}
    spec:
      containers:
        - name: admin
          image: {{ include "fluxify.image" (dict "root" . "name" "fluxify-admin") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: {{- include "fluxify.envFrom" . | nindent 12 }}
          env:
            - { name: ENABLE_ADMIN, value: "true" }
            - { name: ENABLE_BUILTIN_WORKER, value: "false" }
            - { name: SEED_USER_EMAIL, value: {{ .Values.admin.seedUserEmail | quote }} }
            {{- if .Values.license.issuerKeySecret }}
            - { name: LICENSE_ISSUER_KEY_PATH, value: /etc/fluxify/license/issuer.pub }
            {{- end }}
            {{- include "fluxify.pgEnv" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          # Migrations run before it answers, so a first start is given time.
          startupProbe:
            httpGet: { path: /_/admin/api/public-settings, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /_/admin/api/public-settings, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.admin.resources | nindent 12 }}
          {{- include "fluxify.license" . | nindent 10 }}
      {{- include "fluxify.licenseVolume" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fluxify-admin
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fluxify.labels" . | nindent 4 }}
spec:
  selector: { app: fluxify-admin }
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if .Values.ingressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fluxify-admin
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fluxify.labels" . | nindent 4 }}
spec:
  entryPoints: [{{ .Values.ingressRoute.entryPoint }}]
  routes:
    - kind: Rule
      match: PathPrefix(`/_/admin`)
      # Above every worker's route: a project host is 50, the catch-all 1.
      priority: 100
      services:
        - { name: fluxify-admin, port: 8080 }
{{- end }}
