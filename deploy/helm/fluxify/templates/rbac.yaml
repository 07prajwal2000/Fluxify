apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluxify-orchestrator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fluxify.labels" . | nindent 4 }}
---
# Only its own namespace, and only the kinds it creates for a claim.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fluxify-orchestrator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fluxify.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "triggerauthentications"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["fluxify.rest"]
    resources: ["nodeclaims"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["fluxify.rest"]
    resources: ["nodeclaims/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fluxify-orchestrator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fluxify.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: fluxify-orchestrator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: fluxify-orchestrator
  apiGroup: rbac.authorization.k8s.io
