{{- if .Values.secret.create }}
{{- $values := .Values.secret.values }}
{{- if not (or .Values.postgres.bundled $values.PG_URL .Values.postgres.urlFrom.secret) }}
{{- fail "no database: set postgres.urlFrom.secret or secret.values.PG_URL to your Postgres, or postgres.bundled=true to try Fluxify with a demo one" }}
{{- end }}
{{- $stored := (lookup "v1" "Secret" .Release.Namespace "fluxify-env").data | default dict }}
{{- /* Generated when left empty. PG_URL is never made up. */}}
{{- $generated := list "BETTER_AUTH_SECRET" "SYSTEM_ACCESS_KEY" "NATS_TOKEN" "REDIS_PASS" "SEED_USER_PASSWORD" "PG_PASSWORD" }}
apiVersion: v1
kind: Secret
metadata:
  name: fluxify-env
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fluxify.labels" . | nindent 4 }}
  annotations:
    # Losing MASTER_ENCRYPTION_KEY loses what it encrypted, so uninstall keeps it.
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $key, $value := $values }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc }}
  {{- else if hasKey $stored $key }}
  {{ $key }}: {{ index $stored $key }}
  {{- else if eq $key "MASTER_ENCRYPTION_KEY" }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | b64enc }}
  {{- else if has $key $generated }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
